<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
<title>皮皮音乐 · PipiMusic</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ios.css">
</head>
<body>

<div class="app" id="app" data-view="search">

  <!-- ======================= 侧边栏 ======================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div class="brand-text">
        <b>皮皮音乐</b>
        <i>PipiMusic</i>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="search" aria-current="page">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>搜索</span>
      </button>
      <button class="nav-item" data-view="top">
        <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg>
        <span>榜单</span>
      </button>
      <button class="nav-item" data-view="fav">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7 3.5C19 15.65 12 20 12 20z"/></svg>
        <span>收藏</span>
        <em class="badge" id="favCount">0</em>
      </button>
      <button class="nav-item" data-view="playlist">
        <svg viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18.5" cy="16.5" r="2.5"/><path d="M21 16.5V8l-3 .8"/></svg>
        <span>我的歌单</span>
        <em class="badge" id="plCount">0</em>
      </button>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>最近</span>
      </button>
      <button class="nav-item" data-view="downloads">
        <svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M4 18h16"/></svg>
        <span>下载</span>
        <em class="badge" id="dlBadge">0</em>
      </button>
    </nav>

    <div class="side-foot">
      <div class="eq" id="miniEq"><i></i><i></i><i></i><i></i></div>
      <span id="sideTip">已就绪</span>
    </div>
  </aside>

  <!-- ======================= 主区 ======================= -->
  <main class="main">

    <header class="topbar">
      <h1 class="screen-title" id="screenTitle">皮皮音乐</h1>
      <div class="toprow">
        <div class="searchbox">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="text" inputmode="search" enterkeyhint="search" aria-label="搜索歌曲或歌手" placeholder="歌曲或歌手" autocomplete="off" spellcheck="false">
          <button id="searchBtn" class="go">搜索</button>
        </div>
        <button class="lyric-toggle on" id="lyricToggle" title="显示 / 隐藏歌词">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
        </button>
      </div>
      <div class="sources" id="sourceBar"></div>
      <details class="media-settings" id="mediaSettings" hidden>
        <summary aria-label="播放与下载设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--panel)"/><circle cx="15" cy="17" r="2" fill="var(--panel)"/></svg>
          <span>设置</span>
        </summary>
        <div class="media-settings-options">
          <label>外观
            <select id="appearanceMode">
              <option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
            </select>
          </label>
          <label>播放分段并发
            <select id="playWorkers">
              <option value="1">1 路</option><option value="2">2 路</option><option value="3">3 路</option>
              <option value="4">4 路</option><option value="6">6 路</option><option value="8">8 路</option>
              <option value="12">12 路</option><option value="16">16 路</option>
            </select>
          </label>
          <label>下载并发
            <select id="downloadWorkers">
              <option value="1">1 路</option><option value="2">2 路</option><option value="3">3 路</option><option value="4">4 路</option>
              <option value="5">5 路</option><option value="6">6 路</option><option value="7">7 路</option><option value="8">8 路</option>
              <option value="10">10 路</option><option value="12">12 路</option><option value="16">16 路</option>
            </select>
          </label>
        </div>
      </details>
    </header>

    <!-- 搜索视图 -->
    <section class="view active" id="view-search">
      <div class="hero" id="hero">
        <div class="search-feature">
          <div class="search-feature-copy">
            <h2>今天想听什么？</h2>
            <p>从一首熟悉的歌开始。</p>
          </div>
          <div class="search-record" aria-hidden="true"></div>
        </div>
        <h3 class="search-suggestions-title">试着搜一首</h3>
        <div class="chips" id="chips">
          <button data-kw="青花瓷">青花瓷</button>
          <button data-kw="晴天">晴天</button>
          <button data-kw="夜曲">夜曲</button>
          <button data-kw="红豆">红豆</button>
          <button data-kw="海阔天空">海阔天空</button>
          <button data-kw="告白气球">告白气球</button>
        </div>
      </div>

      <div class="list-head" id="searchHead" hidden>
        <h2 id="searchTitle">搜索结果</h2>
        <span id="searchMeta"></span>
      </div>
      <details class="search-history" id="searchHistory" hidden open>
        <summary>搜索历史</summary>
        <div class="chips" id="searchHistoryList"></div>
      </details>
      <div class="songs" id="searchList"></div>
    </section>

    <!-- 榜单视图 -->
    <section class="view" id="view-top">
      <div class="list-head">
        <h2>榜单</h2>
        <div class="tabs" id="topTabs">
          <button class="tab active" data-which="new">新歌榜</button>
          <button class="tab" data-which="top">TOP 榜</button>
          <button class="tab" data-which="dj">DJ 舞曲</button>
        </div>
      </div>
      <div class="songs" id="topList"></div>
    </section>

    <!-- 收藏视图 -->
    <section class="view" id="view-fav">
      <div class="list-head">
        <h2>我的收藏</h2>
        <span id="favMeta"></span>
      </div>
      <div class="songs" id="favList"></div>
    </section>

    <!-- 历史视图 -->
    <section class="view" id="view-history">
      <div class="list-head">
        <h2>最近播放</h2>
        <button class="ghost" id="clearHistory">清空</button>
      </div>
      <div class="songs" id="historyList"></div>
    </section>

    <!-- 歌单导入视图 -->
    <section class="view" id="view-playlist">
      <div class="list-head">
        <h2>我的歌单</h2>
        <span id="plMeta"></span>
      </div>

      <div class="playlists" id="plList"></div>

      <div class="import-box">
        <textarea id="importText" spellcheck="false" aria-label="歌单分享链接或歌曲列表"
          placeholder="粘贴公开歌单分享链接，或每行填写一首「歌名 - 歌手」"></textarea>
        <div class="import-bar">
          <div class="import-tips">
            <span class="tip-chip dim">QQ音乐 · 酷狗 · 汽水 · 文本</span>
          </div>
          <button id="importBtn" class="primary-btn">导入歌单</button>
        </div>
        <div class="import-err" id="importErr" hidden></div>
      </div>

    </section>

    <!-- 已下载 -->
    <section class="view" id="view-downloads">
      <div class="list-head">
        <h2>已下载</h2>
        <span id="dlMeta"></span>
        <div class="head-acts">
          <button class="ghost-btn" id="dlOpenFolder">打开文件夹</button>
          <button class="ghost-btn" id="dlRefresh">刷新</button>
        </div>
      </div>
      <div class="songs" id="dlList"></div>
    </section>

  </main>

  <!-- ======================= 歌词面板 ======================= -->
  <aside class="lyrics" id="lyricsPane">
    <div class="lyric-head">
      <span>歌词</span>
      <button id="lyricClose" title="收起">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="lyric-body" id="lyricBody">
      <div class="lyric-empty" id="lyricEmpty">播放歌曲后显示歌词</div>
      <ul class="lyric-list" id="lyricList"></ul>
    </div>
  </aside>

  <!-- ======================= 播放条 ======================= -->
  <footer class="playbar" id="playbar">
    <div class="player-heading">
      <button type="button" id="closePlayer" aria-label="收起播放页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span>正在播放</span>
    </div>
    <div class="now">
      <section id="playerQueue" aria-labelledby="queueTitle" tabindex="-1" hidden>
        <header>
          <h2 id="queueTitle">播放列表</h2>
          <button type="button" id="playFavorites">播放收藏</button>
        </header>
        <ol id="queueTracks"></ol>
        <p id="queueEmpty">收藏或搜索歌曲后即可播放</p>
      </section>
      <section id="playerLyrics" aria-label="同步歌词" tabindex="-1" hidden></section>
      <div class="turntable" aria-hidden="true">
        <span class="turntable-switch"></span>
        <svg class="tonearm" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="armSteel">
              <stop stop-color="#3c4247"/><stop offset=".52" stop-color="#dce1e4"/><stop offset="1" stop-color="#4e555a"/>
            </linearGradient>
          </defs>
          <circle cx="86" cy="15" r="7.4" fill="#24292d" stroke="#4b5358" stroke-width="1.4"/>
          <circle cx="86" cy="15" r="4.5" fill="url(#armSteel)" stroke="#8e979d" stroke-width=".9"/>
          <path d="M86 22v41c0 8-2 13-6 18l-7 8" fill="none" stroke="#272d31" stroke-width="3.5"/>
          <path d="M86 22v41c0 8-2 13-6 18l-7 8" fill="none" stroke="url(#armSteel)" stroke-width="2.1"/>
          <g transform="translate(72 91) rotate(34)">
            <rect x="-2.6" y="-5" width="5.2" height="9" rx=".7" fill="url(#armSteel)" stroke="#33383c" stroke-width=".7"/>
            <rect x="-1.4" y="-1" width="2.8" height="3.3" rx=".4" fill="#23272a"/>
          </g>
        </svg>
      </div>
      <button type="button" id="openPlayer" aria-label="展开播放页" aria-controls="playbar" aria-expanded="false">
        <span class="disc" id="disc">
          <img id="nowCover" alt="">
          <span class="disc-hole"></span>
        </span>
        <span class="now-meta">
          <span class="now-title" id="nowTitle">未播放</span>
          <span class="now-details">
            <span class="now-artist" id="nowArtist">选一首开始</span>
            <span id="nowFormat" class="now-format" hidden></span>
            <span id="nowSource" class="now-format" hidden></span>
          </span>
        </span>
      </button>
      <button class="fav-btn" id="favBtn" title="收藏 / 取消收藏">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7 3.5C19 15.65 12 20 12 20z"/></svg>
      </button>
      <button type="button" id="playerLyricsPreview" aria-label="展开全部歌词" aria-controls="playerLyrics" aria-expanded="false" disabled>
        <span id="playerLyricCurrent">播放歌曲后显示歌词</span>
        <span id="playerLyricNext" hidden></span>
      </button>
    </div>

    <div class="center">
      <div class="controls">
        <button class="ctl" id="btnPlay" title="播放 / 暂停 (空格)">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
        </button>
        <button class="ctl sm" id="btnPrev" title="上一首">
          <svg viewBox="0 0 24 24"><path d="M19 5l-10 7 10 7zM6 5v14"/></svg>
        </button>
        <button class="ctl sm" id="btnNext" title="下一首">
          <svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7zM18 5v14"/></svg>
        </button>
        <button type="button" class="ctl sm" id="btnLoop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg>
          <span id="playModeLabel">顺序播放</span>
        </button>
        <button type="button" class="ctl sm" id="queueToggle" aria-label="播放列表" aria-controls="playerQueue" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 11h18M3 17h9m4-2 5 3-5 3z"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="t" id="tCur">0:00</span>
        <div class="bar" id="seekBar">
          <div class="bar-bg"></div>
          <div class="bar-fill" id="seekFill"></div>
          <div class="bar-knob" id="seekKnob"></div>
        </div>
        <span class="t" id="tDur">0:00</span>
      </div>
    </div>

    <div class="right">
      <button class="mini" id="dlBtn" title="下载歌曲">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      </button>
      <button class="mini" id="btnMute" title="静音">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <div class="vbar" id="volBar">
        <div class="bar-bg"></div>
        <div class="bar-fill" id="volFill" style="width:70%"></div>
      </div>
    </div>
  </footer>
</div>

<audio id="audio" preload="auto"></audio>

<div class="toast" id="toast"></div>

<script src="ios-shim.js"></script>
<script src="app.js"></script>
</body>
</html>
